name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Update application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USERNAME@$SSH_HOST" \
            'set -euo pipefail
             DEPLOY_PATH=/home/virality/tracking
             test -f "$DEPLOY_PATH/compose.yaml"
             git -c safe.directory="$DEPLOY_PATH" -C "$DEPLOY_PATH" pull --ff-only origin main
             if [ ! -f "$DEPLOY_PATH/.env" ]; then
               umask 077
               POSTGRES_PASSWORD=$(openssl rand -hex 24)
               DJANGO_SECRET_KEY=$(openssl rand -hex 48)
               printf "APP_ENV=production\nPOSTGRES_DB=stillhere\nPOSTGRES_USER=stillhere\nPOSTGRES_PASSWORD=%s\nDJANGO_SECRET_KEY=%s\nCHAT_MODEL=gemma3:4b\nEMBEDDING_MODEL=embeddinggemma\n" \
                 "$POSTGRES_PASSWORD" "$DJANGO_SECRET_KEY" > "$DEPLOY_PATH/.env"
             fi
             if ! grep -q "^APP_ENV=" "$DEPLOY_PATH/.env"; then
               printf "\nAPP_ENV=production\n" >> "$DEPLOY_PATH/.env"
             fi
             docker compose --project-directory "$DEPLOY_PATH" -f "$DEPLOY_PATH/compose.yaml" up -d ollama
             docker compose --project-directory "$DEPLOY_PATH" -f "$DEPLOY_PATH/compose.yaml" exec -T ollama ollama pull gemma3:4b
             docker compose --project-directory "$DEPLOY_PATH" -f "$DEPLOY_PATH/compose.yaml" exec -T ollama ollama pull embeddinggemma
             docker compose --project-directory "$DEPLOY_PATH" -f "$DEPLOY_PATH/compose.yaml" up -d --build
             docker compose --project-directory "$DEPLOY_PATH" -f "$DEPLOY_PATH/compose.yaml" ps'

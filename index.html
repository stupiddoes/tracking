<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <title>準時 — 簡單打卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17231d;--muted:#68736c;--paper:#f5f2e9;--card:#fffdf7;--green:#214d3a;--lime:#d8f27a;--line:#deddd4;--orange:#e86f3b;--shadow:0 24px 60px rgba(25,40,32,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans HK",sans-serif;min-height:100vh}button{font:inherit}
    .shell{max-width:480px;margin:auto;min-height:100vh;padding:28px 20px 110px;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:var(--lime);filter:blur(1px);opacity:.28;right:-150px;top:-120px;z-index:-1}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font:700 24px Manrope,sans-serif;letter-spacing:-1px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;font-weight:700;font-size:14px;border:3px solid rgba(255,255,255,.7)}
    .eyebrow{font-size:13px;color:var(--muted);margin:0 0 4px}.greeting{font-size:30px;line-height:1.25;margin:0 0 24px;letter-spacing:-1px}.greeting span{display:block;color:var(--muted);font-size:16px;font-weight:400;letter-spacing:0;margin-top:8px}
    .clock-card{background:var(--green);color:white;border-radius:28px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}.clock-card:after{content:"";position:absolute;width:170px;height:170px;border:38px solid rgba(216,242,122,.14);border-radius:50%;right:-78px;bottom:-95px}.status{display:flex;align-items:center;gap:8px;font-size:13px;color:#dbe7df}.dot{width:8px;height:8px;background:var(--lime);border-radius:50%;box-shadow:0 0 0 5px rgba(216,242,122,.12)}.time{font:600 55px/1 Manrope,sans-serif;letter-spacing:-3px;margin:28px 0 8px}.date{color:#c8d4cc;font-size:14px}.place{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.13);font-size:14px}.pin{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center}.place-copy strong{display:block}.place-copy small{color:#b9c8bf}
    .punch{margin-top:18px;width:100%;height:62px;border:0;border-radius:18px;background:var(--lime);color:var(--ink);font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 9px 0 #b8cf63;transition:.15s}.punch:active{transform:translateY(5px);box-shadow:0 4px 0 #b8cf63}.punch.out{background:#ffd5c5;box-shadow:0 9px 0 #eeb29c}.punch:disabled{opacity:.65;cursor:wait}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:32px 2px 14px}.section-head h2{font-size:18px;margin:0}.section-head span{font-size:13px;color:var(--muted)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.metric small{color:var(--muted)}.metric strong{display:block;font:700 24px Manrope,sans-serif;margin-top:7px}.metric strong em{font:500 12px "Noto Sans HK";font-style:normal;color:var(--muted)}
    .records{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 16px}.record{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.record:last-child{border:0}.record-icon{width:38px;height:38px;border-radius:13px;background:#e7efe9;display:grid;place-items:center;color:var(--green)}.record.out .record-icon{background:#fae6df;color:var(--orange)}.record-copy{flex:1}.record-copy strong{font-size:14px;display:block}.record-copy small{color:var(--muted);font-size:12px}.record-time{font:600 15px Manrope}.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:82px;background:rgba(255,253,247,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:13px}.nav-item{color:var(--muted);font-size:11px;text-align:center}.nav-item b{display:block;font-size:20px;line-height:25px}.nav-item.active{color:var(--green);font-weight:700}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#17231d;color:white;padding:12px 18px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:700px){body{padding:20px}.shell{min-height:calc(100vh - 40px);background:rgba(255,255,255,.24);border-radius:32px;border:1px solid rgba(255,255,255,.8)}nav{bottom:20px;border-radius:0 0 32px 32px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand">準時<span style="color:#79923e">.</span></div><div class="avatar">KC</div></header>
    <p class="eyebrow" id="dayPart">早晨</p>
    <h1 class="greeting">今日，準時開工。<span id="subtitle">準備好就可以打卡</span></h1>
    <section class="clock-card">
      <div class="status"><i class="dot"></i><span id="locationStatus">等候取得位置</span></div>
      <div class="time" id="clock">--:--</div><div class="date" id="date"></div>
      <div class="place"><div class="pin">⌖</div><div class="place-copy"><strong id="region">位置未確認</strong><small id="coords">打卡時會要求定位權限</small></div></div>
    </section>
    <button class="punch" id="punch">開始返工 · 打卡</button>
    <div class="section-head"><h2>今日概覽</h2><span id="recordCount">0 次記錄</span></div>
    <div class="summary"><div class="metric"><small>返工時間</small><strong id="startTime">—</strong></div><div class="metric"><small>工作時間</small><strong id="duration">0<em> 小時</em></strong></div></div>
    <div class="section-head"><h2>打卡記錄</h2><span>只儲存於此裝置</span></div>
    <div class="records" id="records"><div class="empty">今日未有打卡記錄</div></div>
  </main>
  <nav><div class="nav-item active"><b>◉</b>打卡</div><div class="nav-item"><b>▤</b>記錄</div><div class="nav-item"><b>⚙</b>設定</div></nav><div class="toast" id="toast"></div>
  <script>
    const $=s=>document.querySelector(s), key='punch-records-v1'; let records=JSON.parse(localStorage.getItem(key)||'[]');
    const fmt=t=>new Intl.DateTimeFormat('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t));
    function tick(){const n=new Date(),h=n.getHours();$('#clock').textContent=n.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false});$('#date').textContent=n.toLocaleDateString('zh-HK',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#dayPart').textContent=h<12?'早晨':h<18?'午安':'晚上好';render()}
    function todayRecords(){const d=new Date().toDateString();return records.filter(r=>new Date(r.time).toDateString()===d)}
    function render(){const rs=todayRecords(),working=rs.length%2===1;$('#punch').textContent=working?'完成工作 · 收工':'開始返工 · 打卡';$('#punch').classList.toggle('out',working);$('#subtitle').textContent=working?'你已經返緊工，加油！':'準備好就可以打卡';$('#recordCount').textContent=`${rs.length} 次記錄`;$('#startTime').textContent=rs[0]?fmt(rs[0].time):'—';let total=0,start=null;rs.forEach(r=>{if(r.type==='in')start=r.time;else if(start){total+=r.time-start;start=null}});if(start)total+=Date.now()-start;$('#duration').innerHTML=`${(total/36e5).toFixed(1)}<em> 小時</em>`;$('#records').innerHTML=rs.length?[...rs].reverse().map(r=>`<div class="record ${r.type==='out'?'out':''}"><div class="record-icon">${r.type==='in'?'↗':'↙'}</div><div class="record-copy"><strong>${r.type==='in'?'返工打卡':'收工打卡'}</strong><small>${r.region}${r.accuracy?` · 約 ±${Math.round(r.accuracy)}m`:''}</small></div><div class="record-time">${fmt(r.time)}</div></div>`).join(''):'<div class="empty">今日未有打卡記錄</div>'}
    function locate(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('此裝置不支援定位'));navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:30000})})}
    function isHK(lat,lng){return lat>=22.13&&lat<=22.58&&lng>=113.80&&lng<=114.52}
    function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600)}
    $('#punch').onclick=async()=>{const b=$('#punch');b.disabled=true;b.textContent='正在確認位置…';try{const p=await locate(),{latitude:lat,longitude:lng,accuracy}=p.coords,region=isHK(lat,lng)?'香港':'海外';$('#region').textContent=region;$('#coords').textContent=`${lat.toFixed(4)}, ${lng.toFixed(4)}`;$('#locationStatus').textContent='位置已確認';const type=todayRecords().length%2?'out':'in';records.push({time:Date.now(),type,region,accuracy});localStorage.setItem(key,JSON.stringify(records));toast(`${type==='in'?'返工':'收工'}打卡成功 · ${region}`)}catch(e){$('#locationStatus').textContent='未能取得位置';toast(e.code===1?'請允許位置權限後再試':'定位失敗，請稍後再試')}finally{b.disabled=false;render()}};
    tick();setInterval(tick,30000);
  </script>
</body>
</html>
